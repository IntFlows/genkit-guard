name: Framework compatibility
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'
permissions:
  contents: read
jobs:
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        genkit: [minimum, latest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Select Genkit compatibility target
        shell: bash
        run: |
          target=latest
          if [ '${{ matrix.genkit }}' = minimum ]; then
            target=$(node -p "require('./package.json').peerDependencies.genkit.match(/\d+\.\d+\.\d+/)[0]")
          fi
          npm install --no-save --package-lock=false "genkit@$target"
          npm ls genkit
      - run: npm test
      - run: npm run test:package
  redis:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:redis
