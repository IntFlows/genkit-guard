name: Framework compatibility
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'
permissions:
  contents: read
jobs:
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        genkit: [minimum, latest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Select Genkit compatibility target
        shell: bash
        run: |
          target=$(node -p "require('./package.json').peerDependencies.genkit")
          if [ '${{ matrix.genkit }}' = minimum ]; then
            target=$(node -p "require('./package.json').peerDependencies.genkit.match(/\d+\.\d+\.\d+/)[0]")
          fi
          npm install --no-save --package-lock=false "genkit@$target"
          npm ls genkit
          node --version
          npm --version
      - run: npm test
      - run: npm run test:package
  redis:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:redis
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test scripts/test-audit-policy.js
      - run: node scripts/audit-release.js audit-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit-${{ github.sha }}
          path: audit-results/
  rc-checks:
    name: RC required checks
    if: always()
    needs: [compatibility, redis, dependency-audit]
    runs-on: ubuntu-latest
    steps:
      - name: Require compatibility, Redis and scoped audit policy
        env:
          COMPATIBILITY: ${{ needs.compatibility.result }}
          REDIS: ${{ needs.redis.result }}
          AUDIT: ${{ needs.dependency-audit.result }}
        run: test "$COMPATIBILITY" = success && test "$REDIS" = success && test "$AUDIT" = success
